experiment:
  type: vqa
  prompt_file: "configs/prompts/vqa_prompt.py"
  output_schema:
    fields:
      action: "string"
      objects: "list"

model:
  name: qwen_omni
  checkpoint: "auto"
  weights_path: "/data-slow/models/Qwen/Qwen3-Omni-30B-A3B-Instruct"
  load_kwargs:
    profile: "server"
    device_map: "auto"
    max_memory:
      0: "46GiB"
      1: "46GiB"
      3: "46GiB"
      4: "46GiB"
    torch_dtype: "float16"

data:
  video_path: "/data-fast/videos/videos_test/frames_16/action_anticipation_test/videos/005013_L_mosaic/vid_00500-00580.mp4"
  chunk_duration: 3.0
  chunk_stride: 3.0
  fps: 1.0
  resize: [112, 112]

execution:
  backend: single_device

output:
  format: json
  path: "../data-slow/results/qwen_vqa_output_server.json"
