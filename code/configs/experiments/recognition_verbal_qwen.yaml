experiment:
  type: recognition

model:
  name: qwen_omni
  checkpoint: "Qwen/Qwen2.5-Omni-7B"
  weights_path: ""
  quantization: "none"
  load_kwargs:
    profile: "server"

data:
  video_path: "../../../data/mosaics/001080/001080_L_mosaic.mp4"
  chunk_duration: 2.0
  chunk_stride: 2.0
  fps: 1.0
  resize: [112, 112]

execution:
  backend: single_device

output:
  format: json
  path: "../data-slow/results/recognition_verbal_qwen_output.json"

extra:
  recognition_category: verbal
  recognition_video_id: "001080"
  recognition_template_path: "configs/recognition/example_template.json"